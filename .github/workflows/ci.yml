name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Report both platforms even when one fails: the terminal and daemon code
      # has separate darwin and linux paths.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf 'gofmt would rewrite:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Completion tests skip a shell they cannot find, so without these the
      # Ubuntu job would silently cover only bash while macOS covers zsh.
      - name: Install shells for completion tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Test
        run: go test ./...

      - name: Test with the race detector
        run: go test -race ./...

      - name: Check go.mod and go.sum are tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # The CLI cross-compiles for platforms beyond macOS and Linux, where
  # interactive sessions, secret input and the forwarding daemon return an
  # explicit unsupported error instead. No test run here: the terminal, pty and
  # daemon tests need a real unix host, so a windows runner is not worth it.
  windows:
    name: windows build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        env:
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...
